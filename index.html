<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム ビブス・ユニフォーム管理アプリ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 text-slate-800">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- ヘッダー -->
    <header class="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">🎽 ビブス・ユニフォーム管理アプリ</h1>
        <p class="text-xs text-slate-500 mt-1">リアルタイムで割り当て状況が同期されます</p>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <!-- 元に戻す（Undo）ボタン -->
        <button id="undoBtn" onclick="undo()" disabled class="flex-1 sm:flex-none bg-slate-200 text-slate-400 font-medium px-3 py-2 rounded-lg text-sm flex items-center justify-center gap-1 transition cursor-not-allowed">
          <span>↩️ 元に戻す</span>
        </button>
        <button id="copyUrlBtn" onclick="copyShareUrl()" class="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm flex items-center justify-center gap-2 transition">
          <span>🔗 共有URLをコピー</span>
        </button>
      </div>
    </header>

    <!-- メンバー追加・選択エリア -->
    <section class="bg-white p-4 rounded-xl shadow-sm space-y-3">
      <h2 class="font-bold text-sm text-slate-600">1. メンバー追加・選択（名前タップで選択／✏️編集／🗑️削除）</h2>
      <div class="flex gap-2">
        <input type="text" id="memberName" placeholder="メンバー名を入力" class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="addMember()" class="bg-slate-800 hover:bg-slate-900 text-white font-medium px-4 py-2 rounded-lg text-sm transition">追加</button>
      </div>
      <div id="memberList" class="flex flex-wrap gap-2 pt-2">
        <!-- メンバー一覧がここに表示されます -->
      </div>
    </section>

    <!-- ビブス種類（カテゴリ）タブエリア -->
    <section class="bg-white p-4 rounded-xl shadow-sm space-y-3">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <h2 class="font-bold text-sm text-slate-600">2. ビブスの種類（チーム・用途）を選択</h2>
        <div class="flex gap-2">
          <input type="text" id="categoryNameInput" placeholder="新しい種類名(例: ビブスB)" class="border rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
          <button onclick="addCategory()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-1 rounded text-xs transition">種類を追加</button>
        </div>
      </div>
      <div id="categoryTabs" class="flex flex-wrap gap-2 pt-1 border-t pt-3">
        <!-- タブボタンがここに並びます -->
      </div>
    </section>

    <!-- ビブス一覧エリア -->
    <section class="bg-white p-4 rounded-xl shadow-sm space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b pb-3">
        <div class="flex items-center gap-2">
          <h2 id="currentCategoryTitle" class="font-bold text-base text-indigo-600">FPチーム</h2>
          <button onclick="deleteCurrentCategory()" class="text-xs text-slate-400 hover:text-red-600" title="この種類を削除">🗑️削除</button>
        </div>
        
        <!-- ビブス枚数変更 & 全解除 -->
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1.5 text-xs">
            <span class="text-slate-500 font-medium">枚数:</span>
            <input type="number" id="bibCountInput" min="1" max="99" class="w-16 border rounded px-2 py-1 text-center font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" value="12">
            <button onclick="updateBibCount()" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold px-2.5 py-1 rounded transition text-xs">変更</button>
          </div>
          <button onclick="resetBibs()" class="text-xs text-red-500 hover:text-red-700 underline font-medium ml-auto sm:ml-0">この種類を全解除</button>
        </div>
      </div>

      <div id="bibGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        <!-- ビブス枠がここに表示されます -->
      </div>
    </section>

  </div>

  <script>
    // ⚠️ ご自身のFirebaseコンソールの設定情報と差し替えてください
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "alshine-bibs-management-app.firebaseapp.com",
      projectId: "alshine-bibs-management-app",
      storageBucket: "alshine-bibs-management-app.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 初期化
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const docRef = db.collection("bibsApp").doc("state");

    let selectedMember = null;
    let historyStack = []; // 履歴スタック

    let state = {
      members: ["選手A", "選手B", "選手C", "選手D"],
      categories: {
        "FPチーム": { bibCount: 12, assignments: {} },
        "GK用": { bibCount: 2, assignments: {} }
      },
      currentCategory: "FPチーム"
    };

    // リアルタイム受信設定
    docRef.onSnapshot((doc) => {
      if (doc.exists) {
        const data = doc.data();
        state = {
          members: data.members || ["選手A", "選手B", "選手C", "選手D"],
          categories: data.categories || { "FPチーム": { bibCount: 12, assignments: {} } },
          currentCategory: data.currentCategory || Object.keys(data.categories || { "FPチーム": {} })[0]
        };
        // 万が一現在のカテゴリが存在しなくなっていた場合のフォールバック
        if (!state.categories[state.currentCategory]) {
          state.currentCategory = Object.keys(state.categories)[0];
        }
        render();
      } else {
        saveState(state, false);
      }
    });

    function saveState(newState, recordHistory = true) {
      if (recordHistory) {
        historyStack.push(JSON.parse(JSON.stringify(state)));
        if (historyStack.length > 20) historyStack.shift();
      }
      docRef.set(newState);
      updateUndoButtonState();
    }

    function undo() {
      if (historyStack.length === 0) return;
      const previousState = historyStack.pop();
      docRef.set(previousState);
      updateUndoButtonState();
    }

    function updateUndoButtonState() {
      const undoBtn = document.getElementById("undoBtn");
      if (!undoBtn) return;
      if (historyStack.length > 0) {
        undoBtn.disabled = false;
        undoBtn.className = "flex-1 sm:flex-none bg-amber-500 hover:bg-amber-600 text-white font-medium px-3 py-2 rounded-lg text-sm flex items-center justify-center gap-1 transition shadow-sm cursor-pointer";
      } else {
        undoBtn.disabled = true;
        undoBtn.className = "flex-1 sm:flex-none bg-slate-200 text-slate-400 font-medium px-3 py-2 rounded-lg text-sm flex items-center justify-center gap-1 transition cursor-not-allowed";
      }
    }

    function render() {
      updateUndoButtonState();

      // 現在のカテゴリデータ取得
      const curCatData = state.categories[state.currentCategory] || { bibCount: 12, assignments: {} };

      // タイトル更新
      document.getElementById("currentCategoryTitle").textContent = `🎽 ${state.currentCategory}`;

      // 枚数入力欄の更新
      const bibCountInput = document.getElementById("bibCountInput");
      if (document.activeElement !== bibCountInput) {
        bibCountInput.value = curCatData.bibCount || 12;
      }

      // カテゴリタブのレンダリング
      const categoryTabsEl = document.getElementById("categoryTabs");
      categoryTabsEl.innerHTML = "";
      Object.keys(state.categories).forEach(catName => {
        const isCurrent = catName === state.currentCategory;
        const tabBtn = document.createElement("button");
        tabBtn.className = `px-3.5 py-1.5 rounded-lg text-xs font-bold transition shadow-sm ${
          isCurrent 
            ? "bg-indigo-600 text-white shadow" 
            : "bg-slate-100 text-slate-600 hover:bg-slate-200"
        }`;
        tabBtn.textContent = catName;
        tabBtn.onclick = () => switchCategory(catName);
        categoryTabsEl.appendChild(tabBtn);
      });

      // メンバー表示
      const memberListEl = document.getElementById("memberList");
      memberListEl.innerHTML = "";
      (state.members || []).forEach(m => {
        // 現在のカテゴリ内での割り当てチェック
        let assignedBibNum = null;
        if (curCatData.assignments) {
          for (const [bib, member] of Object.entries(curCatData.assignments)) {
            if (member === m) {
              assignedBibNum = bib;
              break;
            }
          }
        }

        const isSelected = selectedMember === m;
        
        const wrapper = document.createElement("div");
        wrapper.className = `inline-flex items-center gap-1 border rounded-full px-3 py-1.5 text-xs shadow-sm transition ${
          isSelected 
            ? "border-indigo-600 bg-indigo-50 font-bold" 
            : assignedBibNum 
              ? "bg-slate-50 border-slate-300"
              : "bg-white border-slate-300"
        }`;

        const nameBtn = document.createElement("button");
        nameBtn.className = `${isSelected ? 'text-indigo-600' : assignedBibNum ? 'text-slate-500 font-medium' : 'text-slate-800'}`;
        nameBtn.textContent = m + (assignedBibNum ? ` (${state.currentCategory}: No.${assignedBibNum})` : "");
        nameBtn.onclick = () => selectMember(m);

        wrapper.appendChild(nameBtn);

        // 割当中の場合は個別解除ボタン
        if (assignedBibNum) {
          const unassignMemberBtn = document.createElement("button");
          unassignMemberBtn.className = "text-red-500 hover:text-red-700 ml-1 font-bold";
          unassignMemberBtn.innerHTML = "❌";
          unassignMemberBtn.title = `No.${assignedBibNum}の割当を解除`;
          unassignMemberBtn.onclick = (e) => { 
            e.stopPropagation(); 
            unassignBib(assignedBibNum); 
          };
          wrapper.appendChild(unassignMemberBtn);
        }

        // 編集ボタン
        const editBtn = document.createElement("button");
        editBtn.className = "text-slate-400 hover:text-indigo-600 ml-1";
        editBtn.innerHTML = "✏️";
        editBtn.title = "名前を編集";
        editBtn.onclick = (e) => { e.stopPropagation(); editMember(m); };
        wrapper.appendChild(editBtn);

        // 削除ボタン
        const deleteBtn = document.createElement("button");
        deleteBtn.className = "text-slate-400 hover:text-red-600 ml-0.5";
        deleteBtn.innerHTML = "🗑️";
        deleteBtn.title = "削除";
        deleteBtn.onclick = (e) => { e.stopPropagation(); deleteMember(m); };
        wrapper.appendChild(deleteBtn);

        memberListEl.appendChild(wrapper);
      });

      // ビブス枠表示 (1〜bibCount番)
      const bibGridEl = document.getElementById("bibGrid");
      bibGridEl.innerHTML = "";
      const totalBibs = curCatData.bibCount || 12;

      for (let i = 1; i <= totalBibs; i++) {
        const key = String(i);
        const assignedName = curCatData.assignments ? curCatData.assignments[key] : null;
        const card = document.createElement("div");
        card.className = `border-2 rounded-xl p-3 text-center flex flex-col justify-between min-h-[100px] transition ${
          assignedName 
            ? "border-indigo-500 bg-indigo-50/60 shadow-sm" 
            : "border-dashed border-slate-300 hover:border-indigo-300 bg-white cursor-pointer"
        }`;
        
        if (assignedName) {
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-indigo-400">No.</span>
              <span class="text-lg font-black text-indigo-600">${i}</span>
            </div>
            <div class="text-sm font-bold text-slate-800 truncate my-1">
              ${assignedName}
            </div>
            <button onclick="event.stopPropagation(); unassignBib(${i})" class="w-full mt-1 bg-red-100 hover:bg-red-200 text-red-600 font-bold py-1 px-2 rounded text-xs transition">
              解除する
            </button>
          `;
        } else {
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-slate-400">No.</span>
              <span class="text-lg font-black text-slate-400">${i}</span>
            </div>
            <div class="text-xs font-medium text-slate-300 my-auto">
              未割り当て
            </div>
            <span class="text-[10px] text-indigo-500 font-medium">タップして割当</span>
          `;
          card.onclick = () => assignBib(i);
        }

        bibGridEl.appendChild(card);
      }
    }

    function switchCategory(catName) {
      const nextState = JSON.parse(JSON.stringify(state));
      nextState.currentCategory = catName;
      selectedMember = null;
      saveState(nextState, true);
    }

    function addCategory() {
      const input = document.getElementById("categoryNameInput");
      const name = input.value.trim();
      if (!name) return;

      const nextState = JSON.parse(JSON.stringify(state));
      if (nextState.categories[name]) {
        alert("すでに存在する種類名です");
        return;
      }

      nextState.categories[name] = { bibCount: 12, assignments: {} };
      nextState.currentCategory = name;
      input.value = "";
      saveState(nextState, true);
    }

    function deleteCurrentCategory() {
      const keys = Object.keys(state.categories);
      if (keys.length <= 1) {
        alert("最後の1つの種類は削除できません");
        return;
      }
      if (!confirm(`「${state.currentCategory}」のカテゴリを削除しますか？`)) return;

      const nextState = JSON.parse(JSON.stringify(state));
      delete nextState.categories[state.currentCategory];
      nextState.currentCategory = Object.keys(nextState.categories)[0];
      selectedMember = null;
      saveState(nextState, true);
    }

    function selectMember(name) {
      selectedMember = selectedMember === name ? null : name;
      render();
    }

    function addMember() {
      const input = document.getElementById("memberName");
      const name = input.value.trim();
      if (!name) return;
      if (!state.members) state.members = [];
      if (!state.members.includes(name)) {
        const nextState = JSON.parse(JSON.stringify(state));
        nextState.members.push(name);
        saveState(nextState, true);
      }
      input.value = "";
    }

    function editMember(oldName) {
      const newName = prompt(`「${oldName}」の新しい名前を入力してください:`, oldName);
      if (!newName || newName.trim() === "" || newName === oldName) return;
      const trimmed = newName.trim();

      const nextState = JSON.parse(JSON.stringify(state));

      const index = nextState.members.indexOf(oldName);
      if (index !== -1) {
        nextState.members[index] = trimmed;
      }

      // 全カテゴリの割り当て名も置換
      Object.values(nextState.categories).forEach(cat => {
        if (cat.assignments) {
          Object.keys(cat.assignments).forEach(k => {
            if (cat.assignments[k] === oldName) {
              cat.assignments[k] = trimmed;
            }
          });
        }
      });

      if (selectedMember === oldName) selectedMember = trimmed;
      saveState(nextState, true);
    }

    function deleteMember(name) {
      if (!confirm(`「${name}」をメンバーから削除しますか？`)) return;

      const nextState = JSON.parse(JSON.stringify(state));
      nextState.members = (nextState.members || []).filter(m => m !== name);

      // 全カテゴリの割り当てから削除
      Object.values(nextState.categories).forEach(cat => {
        if (cat.assignments) {
          Object.keys(cat.assignments).forEach(k => {
            if (cat.assignments[k] === name) {
              delete cat.assignments[k];
            }
          });
        }
      });

      if (selectedMember === name) selectedMember = null;
      saveState(nextState, true);
    }

    function assignBib(bibNum) {
      if (!selectedMember) {
        alert("先に上のメンバー一覧から割り当てたい人を選択してください");
        return;
      }
      
      const nextState = JSON.parse(JSON.stringify(state));
      const curCat = nextState.categories[nextState.currentCategory];
      if (!curCat.assignments) curCat.assignments = {};
      
      // 同じカテゴリ内で、このメンバーがすでに他のビブスに割り当てられていれば外す
      Object.keys(curCat.assignments).forEach(k => {
        if (curCat.assignments[k] === selectedMember) delete curCat.assignments[k];
      });

      curCat.assignments[String(bibNum)] = selectedMember;
      selectedMember = null;
      saveState(nextState, true);
    }

    function unassignBib(bibNum) {
      const nextState = JSON.parse(JSON.stringify(state));
      const curCat = nextState.categories[nextState.currentCategory];
      if (curCat.assignments) {
        delete curCat.assignments[String(bibNum)];
        saveState(nextState, true);
      }
    }

    function resetBibs() {
      if (confirm(`「${state.currentCategory}」のすべてのビブス割り当てをリセットしますか？`)) {
        const nextState = JSON.parse(JSON.stringify(state));
        nextState.categories[nextState.currentCategory].assignments = {};
        saveState(nextState, true);
      }
    }

    function updateBibCount() {
      const input = document.getElementById("bibCountInput");
      const count = parseInt(input.value, 10);
      if (isNaN(count) || count < 1) {
        alert("1以上の数値を入力してください");
        return;
      }

      const nextState = JSON.parse(JSON.stringify(state));
      const curCat = nextState.categories[nextState.currentCategory];
      curCat.bibCount = count;
      
      // 枚数を減らした場合、その範囲外の割り当てを解除
      if (curCat.assignments) {
        Object.keys(curCat.assignments).forEach(k => {
          if (parseInt(k, 10) > count) {
            delete curCat.assignments[k];
          }
        });
      }
      
      saveState(nextState, true);
    }

    function copyShareUrl() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert("共有URLをコピーしました！このURLを他の方へ共有してください。");
      });
    }
  </script>
</body>
</html>
